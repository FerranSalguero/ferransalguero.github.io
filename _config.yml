#
# Blog Settings
#
author: Ferran Salguero
description: "Ferran Salguero - blog personal sobre desenvolupament de software, .NET, Azure i solucions informatiques a mesura."
url: https://ferransalguero.github.io
title: Ferran Salguero
subtitle:
gravatar_url:
subscribe_rss: /atom.xml

# Github repositories
github_user: FerranSalguero
github_repo_url: https://github.com/FerranSalguero/ferransalguero.github.io

# Twitter
twitter_user: ferransalguero
twitter_tweet_button: true

# Disqus Comments (replaced by giscus)
# disqus_short_name: ferransalguero
# disqus_show_comment_count: true

# Google Analytics (GA4). Universal Analytics (UA-*) was shut down 2023-07-01.
# Create a GA4 property and paste its Measurement ID (G-XXXXXXXXXX) below to re-enable analytics.
google_analytics_tracking_id:


#
# Jekyll Settings
#
timezone: Europe/Berlin
markdown: kramdown
# redcarpet:
#   extensions: ["tables"]
#permalink: /archive/:year/:month/:day/:title/
permalink: /blog/:title/
paginate: 20
paginate_path: "/blog/page/:num"
category_dir: categories
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
sass:
    style: compressed

# gems:
  # - jekyll-redirect-from
  # - jekyll-paginate
  # - jekyll-coffeescript


collections:
  portfolios:
    output: true
    permalink: /portfolio/:path.html
    
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-coffeescript